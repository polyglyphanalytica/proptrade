name: paper-trade
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
concurrency: paper
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 paper.py
        env: {FEE_TAKER: "0.004", SLIPPAGE: "0.0005"}
      - run: |
          git config user.name paper-bot; git config user.email paper-bot@users.noreply.github.com
          git add data books.json; git diff --cached --quiet || git commit -m "paper: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
